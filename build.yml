name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create project files
        run: |
          mkdir -p www scripts
          cp index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.courier2099.app",
            "appName": "COURIER 2099",
            "webDir": "www",
            "backgroundColor": "#05060a",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          JSON
          cat > scripts/prepare.js <<'JS'
          const fs = require('fs'), path = require('path');
          const root = process.cwd(), nm = path.join(root, 'node_modules'), out = path.join(root, 'www', 'vendor');
          fs.mkdirSync(path.join(out, 'fonts'), { recursive: true });
          const cp = (a, b) => fs.cpSync(a, b, { recursive: true });
          const lf = path.join(nm, 'leaflet', 'dist');
          cp(path.join(lf, 'leaflet.js'), path.join(out, 'leaflet.js'));
          cp(path.join(lf, 'leaflet.css'), path.join(out, 'leaflet.css'));
          cp(path.join(lf, 'images'), path.join(out, 'images'));
          const RANGE = {
            latin: 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD',
            'latin-ext': 'U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF'
          };
          const FONTS = [['orbitron', 'Orbitron', [500, 800]], ['share-tech-mono', 'Share Tech Mono', [400]]];
          let css = '';
          for (const [pkg, family, weights] of FONTS) {
            const dir = path.join(nm, '@fontsource', pkg, 'files');
            if (!fs.existsSync(dir)) continue;
            for (const w of weights) for (const sub of Object.keys(RANGE)) {
              const f = pkg + '-' + sub + '-' + w + '-normal.woff2';
              if (!fs.existsSync(path.join(dir, f))) continue;
              cp(path.join(dir, f), path.join(out, 'fonts', f));
              css += "@font-face{font-family:'" + family + "';font-style:normal;font-weight:" + w + ";font-display:swap;src:url(fonts/" + f + ") format('woff2');unicode-range:" + RANGE[sub] + "}\n";
            }
          }
          fs.writeFileSync(path.join(out, 'fonts.css'), css);
          JS
          cat > scripts/patch-android.js <<'JS'
          const fs = require('fs'), path = require('path');
          const f = path.join(process.cwd(), 'android', 'app', 'src', 'main', 'AndroidManifest.xml');
          let x = fs.readFileSync(f, 'utf8');
          let add = '';
          for (const p of ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'VIBRATE', 'WAKE_LOCK', 'INTERNET'])
            if (!x.includes('android.permission.' + p + '"')) add += '    <uses-permission android:name="android.permission.' + p + '" />\n';
          if (add) x = x.replace('</manifest>', add + '</manifest>');
          if (!x.includes('android:screenOrientation')) x = x.replace('<activity', '<activity\n            android:screenOrientation="portrait"');
          fs.writeFileSync(f, x);
          JS

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/app @capacitor/geolocation @capacitor-community/keep-awake leaflet @fontsource/orbitron @fontsource/share-tech-mono
          npm install -D @capacitor/cli

      - name: Build web assets and Android project
        run: |
          node scripts/prepare.js
          npx cap add android
          npx cap sync android
          node scripts/patch-android.js

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk courier2099.apk
          gh release create "build-${{ github.run_number }}" courier2099.apk \
            --title "COURIER 2099 build ${{ github.run_number }}" \
            --notes "Debug APK. Download courier2099.apk on your phone and install it."

      - uses: actions/upload-artifact@v4
        with:
          name: courier2099-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
